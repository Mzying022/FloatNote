    .error-actions a { display: inline-block; margin: 4px; padding: 9px 15px; border: 1px solid rgba(93, 130, 176, 0.28); border-radius: 999px; }
  </style>

  <script>
    /*
     * GitHub Pages 在任意缺失路径下都会返回 404.html，而浏览器地址栏不会变。
     * 因此不能假设 ./styles 一定指向仓库根目录：向上逐级探测仓库根，再注入样式与光效。
     */
    (function () {
      const candidates = [];
      let dir = location.pathname.endsWith('/')
        ? location.pathname
        : location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1) || '/';
      while (dir) {
        if (!candidates.includes(dir)) candidates.push(dir);
        if (dir === '/') break;
        const parent = dir.replace(/[^/]+\/$/, '');
        if (!parent || parent === dir) break;
        dir = parent.endsWith('/') ? parent : parent + '/';
      }

      async function findBase() {
        for (const candidate of candidates) {
          try {
            const response = await fetch(candidate + 'src/pageAmbient.js', {
              method: 'HEAD',
              cache: 'no-store',
            });
            if (response.ok) return candidate;
          } catch {
            /* 尝试下一个祖先目录 */
          }
        }
        return './';
      }

      function injectStyles(base) {
        for (const name of ['global', 'button', 'theme', 'pages']) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = `${base}styles/${name}.css`;
          document.head.appendChild(link);
        }
      }

      function fixLinks(base) {
        for (const anchor of document.querySelectorAll('[data-root-link]')) {
          anchor.setAttribute('href', base + anchor.getAttribute('data-root-link'));
        }
      }

      async function boot() {
        const base = await findBase();
        document.documentElement.dataset.base = base;
        injectStyles(base);
        fixLinks(base);
        try {
          const module = await import(`${base}src/pageAmbient.js`);
          module.startAmbient(document.getElementById('errorCanvas'), { color: '#b5a7dd' });
        } catch (error) {
          console.warn('[FloatNote] 404 ambient unavailable:', error);
        }
      }

      boot();
    })();
  </script>
